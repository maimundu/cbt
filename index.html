<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Sekolah - Ujian Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CBCB',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 30px rgba(22, 93, 255, 0.15);
            }
            .btn-hover {
                @apply transition-all duration-300 hover:scale-[1.02] hover:shadow-lg;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- ===================== BACKEND SEDERHANA (SIMPAN DATA DI LOCALSTORAGE) ===================== -->
    <script>
        // Data Awal
        const DB = {
            init: function() {
                if(!localStorage.getItem('cbt_admin')) {
                    // Akun default bisa diubah operator sekolah nanti
                    localStorage.setItem('cbt_admin', JSON.stringify({
                        username: 'admin_sekolah',
                        password: 'admin123',
                        nama: 'Operator Sekolah'
                    }));
                }
                if(!localStorage.getItem('cbt_siswa')) localStorage.setItem('cbt_siswa', JSON.stringify([]));
                if(!localStorage.getItem('cbt_soal')) localStorage.setItem('cbt_soal', JSON.stringify([]));
                if(!localStorage.getItem('cbt_hasil')) localStorage.setItem('cbt_hasil', JSON.stringify([]));
            },

            // Fungsi Login
            loginAdmin: function(user, pass) {
                const admin = JSON.parse(localStorage.getItem('cbt_admin'));
                return (admin.username === user && admin.password === pass);
            },
            loginSiswa: function(user, pass) {
                const siswa = JSON.parse(localStorage.getItem('cbt_siswa'));
                return siswa.find(s => s.username === user && s.password === pass);
            },

            // Fungsi Data Siswa
            getSiswa: () => JSON.parse(localStorage.getItem('cbt_siswa')),
            tambahSiswa: function(data) {
                const siswa = this.getSiswa();
                siswa.push(data);
                localStorage.setItem('cbt_siswa', JSON.stringify(siswa));
                return true;
            },

            // Fungsi Data Soal
            getSoal: () => JSON.parse(localStorage.getItem('cbt_soal')),
            tambahSoal: function(data) {
                const soal = this.getSoal();
                soal.push(data);
                localStorage.setItem('cbt_soal', JSON.stringify(soal));
                return true;
            },

            // Simpan Hasil Ujian
            simpanHasil: function(data) {
                const hasil = JSON.parse(localStorage.getItem('cbt_hasil'));
                hasil.push(data);
                localStorage.setItem('cbt_hasil', JSON.stringify(hasil));
                return true;
            }
        };
        DB.init();

        // Fungsi Navigasi
        function tampilkanHalaman(id) {
            document.querySelectorAll('.halaman').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // Fungsi Login
        function prosesLogin(tipe) {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            if(!user || !pass) return alert('Isi Username dan Password!');

            if(tipe === 'admin') {
                if(DB.loginAdmin(user, pass)) {
                    tampilkanHalaman('halaman_admin');
                    return;
                }
                alert('Username atau Password Admin Salah!');
            } else {
                const akun = DB.loginSiswa(user, pass);
                if(akun) {
                    sessionStorage.setItem('siswa_aktif', JSON.stringify(akun));
                    tampilkanHalaman('halaman_siswa');
                    return;
                }
                alert('Akun Siswa Tidak Ditemukan!');
            }
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Logout
        function keluar() {
            sessionStorage.removeItem('siswa_aktif');
            tampilkanHalaman('halaman_login');
            document.getElementById('form_login').reset();
        }
    </script>

    <!-- ===================== HALAMAN LOGIN ===================== -->
    <div id="halaman_login" class="halaman flex items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-md bg-white rounded-2xl p-8 card-shadow">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa fa-graduation-cap text-4xl text-primary"></i>
                </div>
                <h2 class="text-2xl font-bold text-dark">CBT SEKOLAH</h2>
                <p class="text-gray-500 mt-1">Sistem Ujian Berbasis Komputer</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="Masukkan Username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="Masukkan Password">
                </div>

                <div class="grid grid-cols-2 gap-3 mt-6">
                    <button onclick="prosesLogin('admin')" class="bg-primary text-white py-3 rounded-lg font-medium btn-hover">
                        <i class="fa fa-user-shield mr-2"></i> Masuk Admin
                    </button>
                    <button onclick="prosesLogin('siswa')" class="bg-secondary text-white py-3 rounded-lg font-medium btn-hover">
                        <i class="fa fa-user mr-2"></i> Masuk Siswa
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================== HALAMAN ADMIN / OPERATOR ===================== -->
    <div id="halaman_admin" class="halaman hidden">
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa fa-graduation-cap text-primary text-xl"></i>
                    <h1 class="text-xl font-bold text-dark">Panel Operator Sekolah</h1>
                </div>
                <button onclick="keluar()" class="text-red-500 hover:text-red-700 font-medium">
                    <i class="fa fa-sign-out mr-1"></i> Keluar
                </button>
            </div>
        </header>

        <div class="container mx-auto px-4 py-8">
            <div class="grid md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl card-shadow">
                    <h3 class="font-semibold text-gray-600">Total Siswa</h3>
                    <p class="text-3xl font-bold mt-2 text-primary" id="jml_siswa">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl card-shadow">
                    <h3 class="font-semibold text-gray-600">Jumlah Soal</h3>
                    <p class="text-3xl font-bold mt-2 text-secondary" id="jml_soal">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl card-shadow">
                    <h3 class="font-semibold text-gray-600">Hasil Ujian</h3>
                    <p class="text-3xl font-bold mt-2 text-green-600">0</p>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <!-- Form Tambah Akun Siswa -->
                <div class="bg-white p-6 rounded-xl card-shadow">
                    <h3 class="text-lg font-semibold mb-4 border-b pb-2">Tambah Akun Siswa</h3>
                    <form id="form_siswa" class="space-y-3">
                        <input type="text" id="nama_siswa" placeholder="Nama Lengkap" class="w-full p-3 border rounded-lg" required>
                        <input type="text" id="nis_siswa" placeholder="NIS / NISN" class="w-full p-3 border rounded-lg" required>
                        <input type="text" id="user_siswa" placeholder="Username Login" class="w-full p-3 border rounded-lg" required>
                        <input type="password" id="pass_siswa" placeholder="Password Login" class="w-full p-3 border rounded-lg" required>
                        <button type="submit" class="w-full bg-primary text-white py-2 rounded-lg btn-hover">Simpan Akun</button>
                    </form>
                </div>

                <!-- Form Tambah Soal -->
                <div class="bg-white p-6 rounded-xl card-shadow">
                    <h3 class="text-lg font-semibold mb-4 border-b pb-2">Tambah Soal Pilihan Ganda</h3>
                    <form id="form_soal" class="space-y-3">
                        <textarea id="teks_soal" rows="2" placeholder="Tuliskan Pertanyaan" class="w-full p-3 border rounded-lg" required></textarea>
                        <input type="text" id="opsi_a" placeholder="Opsi A" class="w-full p-3 border rounded-lg" required>
                        <input type="text" id="opsi_b" placeholder="Opsi B" class="w-full p-3 border rounded-lg" required>
                        <input type="text" id="opsi_c" placeholder="Opsi C" class="w-full p-3 border rounded-lg" required>
                        <input type="text" id="opsi_d" placeholder="Opsi D" class="w-full p-3 border rounded-lg" required>
                        <select id="kunci_jawaban" class="w-full p-3 border rounded-lg" required>
                            <option value="">Pilih Jawaban Benar</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                        <button type="submit" class="w-full bg-secondary text-white py-2 rounded-lg btn-hover">Simpan Soal</button>
                    </form>
                </div>
            </div>
        </div>

        <script>
            // Update Data Admin
            document.getElementById('jml_siswa').innerText = DB.getSiswa().length;
            document.getElementById('jml_soal').innerText = DB.getSoal().length;

            // Simpan Siswa
            document.getElementById('form_siswa').addEventListener('submit', function(e) {
                e.preventDefault();
                DB.tambahSiswa({
                    nama: document.getElementById('nama_siswa').value,
                    nis: document.getElementById('nis_siswa').value,
                    username: document.getElementById('user_siswa').value,
                    password: document.getElementById('pass_siswa').value
                });
                alert('Akun siswa berhasil dibuat!');
                this.reset();
                document.getElementById('jml_siswa').innerText = DB.getSiswa().length;
            });

            // Simpan Soal
            document.getElementById('form_soal').addEventListener('submit', function(e) {
                e.preventDefault();
                DB.tambahSoal({
                    soal: document.getElementById('teks_soal').value,
                    a: document.getElementById('opsi_a').value,
                    b: document.getElementById('opsi_b').value,
                    c: document.getElementById('opsi_c').value,
                    d: document.getElementById('opsi_d').value,
                    jawaban: document.getElementById('kunci_jawaban').value
                });
                alert('Soal berhasil ditambahkan!');
                this.reset();
                document.getElementById('jml_soal').innerText = DB.getSoal().length;
            });
        </script>
    </div>

    <!-- ===================== HALAMAN SISWA ===================== -->
    <div id="halaman_siswa" class="halaman hidden">
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa fa-graduation-cap text-primary text-xl"></i>
                    <h1 class="text-xl font-bold text-dark">Ujian Online</h1>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-gray-600 font-medium" id="nama_siswa_aktif"></span>
                    <button onclick="keluar()" class="text-red-500 hover:text-red-700 font-medium">
                        <i class="fa fa-sign-out mr-1"></i> Keluar
                    </button>
                </div>
            </div>
        </header>

        <div class="container mx-auto px-4 py-8">
            <div class="bg-white p-6 rounded-xl card-shadow">
                <div class="text-center mb-6">
                    <h3 class="text-xl font-bold">Selamat Datang di Ujian CBT</h3>
                    <p class="text-gray-500 mt-2">Kerjakan soal dengan teliti dan jujur</p>
                </div>
                <div id="daftar_soal" class="space-y-6">
                    <div class="text-center text-gray-500 py-10">
                        <i class="fa fa-file-text-o text-4xl mb-3"></i>
                        <p>Belum ada soal yang disiapkan operator sekolah</p>
                    </div>
                </div>
                <button id="btn_kumpul" class="hidden w-full mt-8 bg-green-600 text-white py-3 rounded-lg font-medium btn-hover">Kumpulkan Jawaban</button>
            </div>
        </div>

        <script>
            // Tampilkan Nama Siswa
            const siswa = JSON.parse(sessionStorage.getItem('siswa_aktif'));
            document.getElementById('nama_siswa_aktif').innerText = siswa.nama;

            // Tampilkan Soal
            const soalList = DB.getSoal();
            if(soalList.length > 0) {
                const wadah = document.getElementById('daftar_soal');
                wadah.innerHTML = '';
                soalList.forEach((s, i) => {
                    wadah.innerHTML += `
                    <div class="border-b pb-5">
                        <p class="font-medium mb-3">${i+1}. ${s.soal}</p>
                        <div class="space-y-2 pl-4">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="jawab${i}" value="A" class="w-4 h-4"> A. ${s.a}
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="jawab${i}" value="B" class="w-4 h-4"> B. ${s.b}
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="jawab${i}" value="C" class="w-4 h-4"> C. ${s.c}
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="jawab${i}" value="D" class="w-4 h-4"> D. ${s.d}
                            </label>
                        </div>
                    </div>`;
                });
                document.getElementById('btn_kumpul').classList.remove('hidden');

                // Proses Pengumpulan
                document.getElementById('btn_kumpul').onclick = function() {
                    let benar = 0;
                    soalList.forEach((s, i) => {
                        const pilih = document.querySelector(`input[name="jawab${i}"]:checked`);
                        if(pilih && pilih.value === s.jawaban) benar++;
                    });
                    const nilai = Math.round((benar / soalList.length) * 100);
                    DB.simpanHasil({
                        nama: siswa.nama,
                        nis: siswa.nis,
                        benar: benar,
                        total: soalList.length,
                        nilai: nilai,
                        waktu: new Date().toLocaleString()
                    });
                    alert(`Ujian Selesai!\nJawaban Benar: ${benar} dari ${soalList.length}\nNilai Anda: ${nilai}`);
                    keluar();
                }
            }
        </script>
    </div>
</body>
</html>
